<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Display User Dashboard</h1>

    <script>

        async function getMockUserData() {

            
            setTimeout(() => {
                const userData = [
                { name: "John Doe",
                  email: "john.doe@example.com"
                },
                {
                name: "Jane Smith",
                email: "jane.smith@example.com"
                },
                {
                    name: "Alice Johnson",
                    email: "alice.johnson@example.com"
                }
               ];
                console.log(userData);
                return userData;
            }, 2000);
        }



        async function displayUserDashboard() {
    
            alert("Fetching user data...");
               getMockUserData()
                .then(userData => {
                    // Display user data on the dashboard
                    const dashboard = document.createElement('div');
                    dashboard.innerHTML = '<h2>User Dashboard</h2>';
                    userData.forEach(user => {
                        const userInfo = document.createElement('p');
                        userInfo.textContent = `Name: ${user.name}, Email: ${user.email}`;
                        dashboard.appendChild(userInfo);
                    });
                    document.body.appendChild(dashboard);
                })
                .catch(error => {
                    console.error('Error fetching user data:', error);
                });
            
        }   
        
        displayUserDashboard();
    </script>
    
</body>
</html>
