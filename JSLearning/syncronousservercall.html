<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="operator.css">
    <script src="operator.js"></script>
</head>
<body>
    <h1>Display User Dashboard</h1>
    <h1>Operators</h1>
    
    <div class="form-container">
        <div class="input-group">
            <label for="firstfield">Enter first Number</label>
            <input type="number" id="firstfield">
        </div>
        <div class="input-group">
            <label for="secondfield">Enter Second Number</label>
            <input type="number" id="secondfield">
        </div>
        <div>
            <button onclick="add()">Add</button>
            <button onclick="substract()">Substract</button>
            <button onclick="division()">Division</button>
            <button onclick="multiplication()">Multiplication</button>
            <button onclick="module()">Module</button>
            <button onclick="(()=>{alert('No operation selected')})()">No operation</button>
        </div>
    </div>
    
    <div id="result"></div>

    <script>
        function displayUserDashboard() {
            alert("Fetching user data...");
            
            try {
                // Initialize a synchronous XMLHttpRequest
                const xhr = new XMLHttpRequest();
                
                // Passing 'false' as the third parameter makes the request synchronous
                xhr.open("GET", "http://localhost:8080/api/users", false); 
                xhr.send();

                // Execution pauses here until the server responds
                if (xhr.status === 200) {
                    const userData = JSON.parse(xhr.responseText);
                    
                    const dashboard = document.createElement('div');
                    dashboard.innerHTML = '<h2>User Dashboard</h2>';
                    
                    userData.forEach(user => {
                        const userInfo = document.createElement('p');
                        userInfo.textContent = `Name: ${user.name}, Email: ${user.email}`;
                        dashboard.appendChild(userInfo);
                    });
                    
                    document.body.appendChild(dashboard);
                } else {
                    throw new Error('Network response was not ok: ' + xhr.statusText);
                }
            } catch (error) {
                console.error('Error fetching user data synchronously:', error);
            }
        }

        // This call will completely block the browser UI thread until it finishes
        displayUserDashboard();
    </script>
</body>
</html>
