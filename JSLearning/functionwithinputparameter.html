<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <h1>Function with Input Parameter Example</h1>

    <script>
        // A function that takes an input parameter
        function greetUser(name) {
            const greeting = `Hello, ${name}!`;  // "Hello name
            alert(greeting);
        }

        // Calling the function with an input parameter
        greetUser("Mrudula");
    </script>
    
</body>
</html>
